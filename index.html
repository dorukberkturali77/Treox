<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treox - AI Cephaneliği</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0f19; --text-color: #ffffff; --text-muted: #94a3b8;
      --card-bg: #111827; --card-border: rgba(255, 255, 255, 0.08);
      --neon-purple: #a855f7; --neon-blue: #3b82f6; --neon-green: #10b981;
      --bot-gradient: linear-gradient(135deg, #06b6d4, #3b82f6);
    }

    body.light-mode {
      --bg-color: #f8fafc; --text-color: #0f172a; --text-muted: #475569;
      --card-bg: #ffffff; --card-border: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); transition: 0.3s; min-height: 100vh; }
    a { text-decoration: none; }

    /* BAKIM EKRANI */
    #maintenanceScreen { position: fixed; inset: 0; background: #0b0f19; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .m-box { background: #111827; border: 1px solid var(--neon-purple); padding: 40px 30px; border-radius: 20px; max-width: 450px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.2); }
    .m-icon { font-size: 60px; margin-bottom: 15px; display: block; }
    .m-title { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #fff; }
    .m-desc { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
    .btn-admin-login { background: transparent; border: 1px solid var(--neon-purple); color: var(--neon-purple); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn-admin-login:hover { background: var(--neon-purple); color: #fff; }

    /* HEADER & HERO */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; gap: 15px; }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
    .logo span { color: var(--neon-purple); }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-suggest-tool { background: rgba(168, 85, 247, 0.15); border: 1px solid var(--neon-purple); color: var(--text-color); padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 20px; cursor: pointer; color: var(--text-color); }
    
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h1 { font-size: 38px; margin-bottom: 12px; font-weight: 800; }
    .hero p { color: var(--text-muted); margin-bottom: 25px; font-size: 15px; }
    .search-container { display: flex; justify-content: center; gap: 10px; max-width: 580px; margin: 0 auto; }
    #searchInput { flex: 1; padding: 14px 22px; border-radius: 30px; border: 2px solid var(--neon-blue); background: var(--card-bg); color: var(--text-color); outline: none; }

    /* KONTROLLER */
    .controls-wrapper { max-width: 1200px; margin: 0 auto 20px; padding: 0 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); cursor: pointer; font-weight: 600; font-size: 13px; }
    .filter-btn.active { background: var(--neon-purple); border-color: var(--neon-purple); color: white; }

    /* KARTLAR */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; padding: 0 20px 100px; }
    .card { background: var(--card-bg); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; border: 1px solid var(--card-border); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 20px; font-weight: 700; }
    .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(168, 85, 247, 0.15); color: var(--neon-purple); }
    .card-desc { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 14px; flex: 1; }
    .card-footer { display: flex; gap: 8px; margin-top: auto; }
    .btn-visit { flex: 1; text-align: center; padding: 10px; background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border-radius: 10px; font-weight: 700; font-size: 14px; }
    .icon-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-color); padding: 9px 12px; border-radius: 10px; cursor: pointer; }
    .admin-controls { margin-top: 15px; border-top: 1px dashed var(--neon-purple); padding-top: 10px; display: flex; justify-content: flex-end; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }

    /* TOAST SİSTEMİ */
    #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 100000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--card-bg); border-left: 4px solid var(--neon-purple); color: var(--text-color); padding: 12px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; animation: slideIn 0.3s ease forwards; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--neon-purple); width: 100%; max-width: 450px; border-radius: 18px; padding: 25px; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: var(--text-color); outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--bot-gradient); color: white; font-weight: 700; cursor: pointer; }
    .close-modal { position: absolute; top: 18px; right: 20px; background: none; border: none; font-size: 22px; color: var(--text-muted); cursor: pointer; }
  </style>
</head>
<body>

  <div id="toastContainer"></div>

  <!-- BAKIM MODU EKRANI -->
  <div id="maintenanceScreen">
    <div class="m-box">
      <span class="m-icon">🛠</span>
      <h2 class="m-title">Sistem Bakımda</h2>
      <p class="m-desc">Treox yönetici modunda yapılandırılıyor.</p>
      <button class="btn-admin-login" onclick="loginAdmin()">🔑 Yönetici Girişi</button>
    </div>
  </div>

  <!-- ANA SİTE İÇERİĞİ -->
  <div id="mainSite" style="display: none;">
    <header>
      <div class="logo">TREOX<span>.</span></div>
      <div class="header-actions">
        <button class="btn-suggest-tool" onclick="openModal()">➕ Araç Ekle</button>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
    </header>

    <section class="hero">
      <h1>Aboneliklere Son: %100 Ücretsiz AI Cephaneliği</h1>
      <p>İhtiyacın olan yapay zeka aracını ara veya rastgele bir tane keşfet.</p>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Örn: Fotoğraf netleştir, sunum yap..." onkeyup="filterTools()">
      </div>
    </section>

    <div class="controls-wrapper">
      <div class="filters">
        <button class="filter-btn active" onclick="setCategory('tümü', event)">🔥 Tümü</button>
        <button class="filter-btn" onclick="setCategory('tasarım', event)">🎨 Tasarım & Görsel</button>
        <button class="filter-btn" onclick="setCategory('ogrenci', event)">📚 Öğrenci & Not</button>
        <button class="filter-btn" onclick="setCategory('muzik', event)">🎵 Müzik & Video</button>
        <button class="filter-btn" onclick="setCategory('araclar', event)">🛠 Genel Araçlar</button>
      </div>
    </div>

    <div class="card-grid" id="toolGrid"></div>
  </div>

  <!-- ARAÇ EKLE MODALI -->
  <div class="modal-overlay" id="suggestModal">
    <div class="modal-box" style="position:relative;">
      <button class="close-modal" onclick="closeModal()">✖</button>
      <h3>➕ Yeni Araç Ekle</h3>
      <input type="text" id="suggestName" placeholder="Araç Adı (Zorunlu)">
      <select id="suggestCategory">
        <option value="tasarım">Tasarım & Görsel</option>
        <option value="ogrenci">Öğrenci & Not</option>
        <option value="muzik">Müzik & Video</option>
        <option value="araclar">Genel Araçlar</option>
      </select>
      <input type="url" id="suggestUrl" placeholder="Website Linki">
      <textarea id="suggestDesc" placeholder="Kısa açıklama"></textarea>
      <button onclick="submitSuggestion()">Sisteme Kaydet</button>
    </div>
  </div>

  <script>
    const MAINTENANCE_MODE = true; 
    const ADMIN_PIN = "1234";
    let isAdmin = false;

    // DOĞRUDAN SİSTEME GÖMÜLÜ TÜM AI ARAÇLARI LISTESI
    const HARDCODED_TOOLS = [
      { id: "leonardo", ad: "Leonardo AI", kategori: "tasarım", tag: "Görsel", link: "https://leonardo.ai", desc: "Midjourney'e para vermeye son! Ücretsiz kredilerle yüksek kaliteli görseller çizdir.", likes: 104 },
      { id: "perplexity", ad: "Perplexity AI", kategori: "ogrenci", tag: "Araştırma", link: "https://perplexity.ai", desc: "Tüm internetten araştırıp kaynaklarıyla birlikte direkt özetler.", likes: 89 },
      { id: "suno", ad: "Suno AI", kategori: "muzik", tag: "Müzik", link: "https://suno.com", desc: "Sözleri yaz, senin için vokalli profesyonel stüdyo şarkısı üretsin.", likes: 142 },
      { id: "gamma", ad: "Gamma App", kategori: "ogrenci", tag: "Sunum", link: "https://gamma.app", desc: "Konuyu yaz, saniyeler içinde görsel tasarımıyla birlikte slayt hazırlasın.", likes: 95 },
      { id: "chatgpt", ad: "ChatGPT", kategori: "araclar", tag: "Sohbet", link: "https://chatgpt.com", desc: "OpenAI tarafından geliştirilen gelişmiş yapay zeka sohbet ve metin üretim asistanı.", likes: 210 },
      { id: "claude", ad: "Claude AI", kategori: "araclar", tag: "Kod & Metin", link: "https://claude.ai", desc: "Kod yazımı ve uzun metin analizinde üstün performans gösteren yapay zeka.", likes: 175 },
      { id: "midjourney", ad: "Midjourney", kategori: "tasarım", tag: "Görsel", link: "https://midjourney.com", desc: "Metin komutlarından en üst kalitede artistik görseller üreten yapay zeka motoru.", likes: 190 },
      { id: "gemini", ad: "Google Gemini", kategori: "araclar", tag: "Asistan", link: "https://gemini.google.com", desc: "Google'ın metin, görsel ve kod işleyebilen çok modlu yapay zekası.", likes: 130 },
      { id: "cursor", ad: "Cursor", kategori: "araclar", tag: "Yazılım", link: "https://cursor.com", desc: "Yapay zeka destekli, kod yazmayı ve otomasyonu hızlandıran kod editörü.", likes: 115 },
      { id: "elevenlabs", ad: "ElevenLabs", kategori: "muzik", tag: "Ses", link: "https://elevenlabs.io", desc: "Metinden son derece gerçekçi insan sesi üreten ve ses klonlayan platform.", likes: 160 },
      { id: "runway", ad: "Runway ML", kategori: "muzik", tag: "Video", link: "https://runwayml.com", desc: "Metin ve görsellerden sinematik yapay zeka videoları üreten yapay zeka.", likes: 120 },
      { id: "canva", ad: "Canva AI", kategori: "tasarım", tag: "Tasarım", link: "https://canva.com", desc: "Yapay zeka araçlarıyla görsel, sunum ve afiş tasarımlarını hızlıca tamamlayın.", likes: 145 },
      { id: "v0", ad: "v0.dev", kategori: "tasarım", tag: "Arayüz", link: "https://v0.dev", desc: "Metin açıklamalarından eksiksiz React ve Tailwind arayüz bileşenleri oluşturun.", likes: 98 }
    ];

    let tools = [...HARDCODED_TOOLS];
    let currentCategory = 'tümü';

    // YÖNETİCİ KONTROLÜ
    function checkMaintenance() {
      if (localStorage.getItem('treoxAdmin') === 'true') {
        isAdmin = true;
        document.getElementById('maintenanceScreen').style.display = 'none';
        document.getElementById('mainSite').style.display = 'block';
        showToast('Yönetici modu aktif 🟢');
      } else if (MAINTENANCE_MODE) {
        document.getElementById('maintenanceScreen').style.display = 'flex';
        document.getElementById('mainSite').style.display = 'none';
      }
    }

    function loginAdmin() {
      const input = prompt("Yönetici Şifrenizi Giriniz:");
      if (input === ADMIN_PIN) {
        localStorage.setItem('treoxAdmin', 'true');
        checkMaintenance();
      } else if (input !== null) {
        alert("Hatalı şifre!");
      }
    }

    // FIREBASE BAĞLANTISI
    const firebaseConfig = {
      apiKey: "AIzaSyCZ9M6zKGNQMdHqSZpn85A4_h-CEbINByo",
      authDomain: "treox-9f404.firebaseapp.com",
      projectId: "treox-9f404"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function listenFirestore() {
      db.collection('tools').onSnapshot((snapshot) => {
        let dynamicTools = [];
        snapshot.forEach((doc) => dynamicTools.push({ id: doc.id, ...doc.data() }));
        if (dynamicTools.length > 0) {
          tools = [...HARDCODED_TOOLS, ...dynamicTools];
        } else {
          tools = [...HARDCODED_TOOLS];
        }
        filterTools();
      });
    }

    function renderTools(filterText = '') {
      const grid = document.getElementById('toolGrid');
      grid.innerHTML = ''; 

      let filtered = tools.filter(tool => {
        const nameVal = tool.ad || tool.name || 'İsimsiz';
        const matchesSearch = nameVal.toLowerCase().includes(filterText);
        const matchesCategory = currentCategory === 'tümü' || tool.kategori === currentCategory;
        return matchesSearch && matchesCategory;
      });

      filtered.forEach(tool => {
        const title = tool.ad || tool.name || 'İsimsiz Araç';
        const desc = tool.desc || tool.description || 'Açıklama yok.';
        const link = tool.link || tool.url || '#';
        const tag = tool.tag || 'AI Araç';
        const likes = tool.likes || 100;

        const card = document.createElement('div');
        card.className = 'card';
        
        let cardHTML = `
          <div class="card-header">
            <div>${title}</div>
            <span class="status-badge">${tag}</span>
          </div>
          <p class="card-desc">${desc}</p>
          <div class="card-footer">
            <a href="${link}" target="_blank" class="btn-visit">Araca Git</a>
            <button class="icon-btn" title="Beğeni">❤️ ${likes}</button>
            <button class="icon-btn" onclick="copyLink('${link}')" title="Kopyala">🔗</button>
          </div>
        `;

        if (isAdmin) {
          cardHTML += `
            <div class="admin-controls">
              <button class="btn-delete" onclick="deleteTool('${tool.id}', '${title}')">🗑️ Aracı Sil</button>
            </div>
          `;
        }

        card.innerHTML = cardHTML;
        grid.appendChild(card);
      });
    }

    function filterTools() { renderTools(document.getElementById('searchInput').value.toLowerCase()); }

    function setCategory(cat, e) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if(e) e.target.classList.add('active');
      filterTools();
    }

    function showToast(message, type = 'default') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = message;
      if(type === 'error') toast.style.borderLeftColor = '#ef4444';
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    function copyLink(link) {
      navigator.clipboard.writeText(link);
      showToast('Bağlantı kopyalandı! 📋');
    }

    async function deleteTool(id, title) {
      if(confirm(`"${title}" silinsin mi?`)) {
        tools = tools.filter(t => t.id !== id);
        try { await db.collection('tools').doc(id).delete(); } catch(e){}
        filterTools();
        showToast(`${title} listeden çıkarıldı.`, 'error');
      }
    }

    function openModal() { document.getElementById('suggestModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('suggestModal').style.display = 'none'; }
    
    async function submitSuggestion() {
      const ad = document.getElementById('suggestName').value;
      const link = document.getElementById('suggestUrl').value;
      const desc = document.getElementById('suggestDesc').value;
      const kategori = document.getElementById('suggestCategory').value;

      if (!ad || !link) { showToast("İsim ve link zorunludur!", "error"); return; }
      
      await db.collection('tools').add({
        ad: ad,
        kategori: kategori,
        link: link,
        desc: desc,
        tag: "Yeni",
        likes: 1
      });

      showToast(`'${ad}' başarıyla eklendi! ✨`);
      closeModal();
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }

    window.onload = () => {
      checkMaintenance();
      renderTools();
      listenFirestore();
    };
  </script>
</body>
</html>
