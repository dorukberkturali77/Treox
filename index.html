<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treox - Ücretsiz AI Araçları</title>
  
  <style>
    /* 1. TEMA DEĞİŞKENLERİ */
    :root {
      --bg-color: #0b0f19;
      --text-color: #ffffff;
      --text-muted: #94a3b8;
      --card-bg: rgba(30, 41, 59, 0.5);
      --card-border: rgba(255, 255, 255, 0.08);
      --neon-purple: #a855f7;
      --neon-blue: #3b82f6;
      --neon-orange: #f97316;
      --bot-gradient: linear-gradient(135deg, #06b6d4, #3b82f6);
    }

    body.light-mode {
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --text-muted: #475569;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; }
    a { text-decoration: none; }

    /* HEADER & HERO */
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
    .logo span { color: var(--neon-purple); }
    .theme-toggle { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-color); }

    .hero { text-align: center; padding: 60px 20px 40px; }
    .hero h1 { font-size: 36px; margin-bottom: 10px; }
    .hero p { color: var(--text-muted); margin-bottom: 30px; font-size: 16px; }
    
    .search-container { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto; }
    #searchInput { flex: 1; padding: 15px 20px; border-radius: 30px; border: 2px solid var(--neon-blue); background: var(--card-bg); color: var(--text-color); font-size: 16px; outline: none; }
    #randomBtn { padding: 0 25px; border-radius: 30px; border: none; background: var(--bot-gradient); color: white; font-size: 20px; cursor: pointer; }

    /* FİLTRELER */
    .filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
    .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); cursor: pointer; }
    .filter-btn.active, .filter-btn:hover { background: var(--neon-purple); border-color: var(--neon-purple); color: white; }

    /* KART TASARIMI */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px 80px; }
    .card { background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; border: 1.5px solid var(--card-border); transition: transform 0.3s; }
    .card:hover { transform: translateY(-5px); }
    
    .badge { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: rgba(128, 128, 128, 0.2); margin-bottom: 14px; }
    .card h3 { font-size: 20px; margin-bottom: 8px; }
    .card p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 22px; flex-grow: 1; }
    
    /* GÜNCEL KART ALTI BUTONLARI */
    .card-footer { display: flex; gap: 8px; align-items: center; margin-top: auto; }
    .btn-link { flex: 1; text-align: center; padding: 10px; background: var(--neon-blue); color: white; border-radius: 10px; font-weight: bold; font-size: 14px; }
    .action-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text-color); padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 14px; transition: 0.2s; }
    .action-btn:hover { background: rgba(255,255,255,0.1); }
    .action-btn.starred { color: #facc15; border-color: #facc15; } /* Sarı Yıldız */

    /* TREOX AI WIDGET */
    .chat-widget { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
    .chat-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--bot-gradient); border: none; font-size: 28px; cursor: pointer; color: white; }
    .chat-window { display: none; position: absolute; bottom: 80px; right: 0; width: 320px; background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid var(--neon-blue); border-radius: 16px; overflow: hidden; flex-direction: column; }
    .chat-header { background: var(--bot-gradient); padding: 15px; color: white; font-weight: bold; display: flex; justify-content: space-between; }
    .close-chat { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    .chat-body { padding: 15px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .bot-msg { background: rgba(59, 130, 246, 0.2); padding: 10px; border-radius: 10px 10px 10px 0; }
    .quick-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--text-muted); color: var(--text-color); padding: 8px; border-radius: 8px; cursor: pointer; text-align: left; margin-top:5px; }

  </style>
</head>
<body>

  <header>
    <div class="logo">TREOX<span>.</span></div>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </header>

  <section class="hero">
    <h1>Aboneliklere Son: %100 Ücretsiz AI Cephaneliği</h1>
    <p>İhtiyacın olan yapay zeka aracını ara veya rastgele bir tane keşfet.</p>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Örn: Fotoğraf netleştir, sunum yap..." onkeyup="filterTools()">
      <button id="randomBtn" onclick="randomTool()" title="Beni Şaşırt!">🎲</button>
    </div>
  </section>

  <div class="filters">
    <button class="filter-btn active" onclick="setCategory('tümü')">🔥 Tümü</button>
    <button class="filter-btn" onclick="setCategory('tasarım')">🎨 Tasarım & Görsel</button>
    <button class="filter-btn" onclick="setCategory('ogrenci')">🎓 Öğrenci & Not</button>
    <button class="filter-btn" onclick="setCategory('ses')">🎵 Müzik & Video</button>
    <button class="filter-btn" onclick="setCategory('favoriler')">⭐ Kaydedilenler</button>
  </div>

  <div class="card-grid" id="toolGrid"></div>

  <div class="chat-widget">
    <div class="chat-window" id="chatWindow">
      <div class="chat-header"><span>🤖 Treox AI</span><button class="close-chat" onclick="toggleChat()">✖</button></div>
      <div class="chat-body" id="chatBody">
        <div class="bot-msg">Selam! Neye ihtiyacın var, hızlıca seç:</div>
        <div id="quickReplies">
          <button class="quick-btn" onclick="botReply('sunum')">📊 Slayt / Sunum Hazırla</button>
          <button class="quick-btn" onclick="botReply('foto')">🖼️ Fotoğraf Netleştir</button>
          <button class="quick-btn" onclick="botReply('muzik')">🎵 Şarkı / Müzik Üret</button>
        </div>
      </div>
    </div>
    <button class="chat-btn" onclick="toggleChat()">🤖</button>
  </div>

  <script>
    // ARAÇ VERİTABANI (Beğeni sayıları eklendi)
    const tools = [
      { id: 1, ad: "Leonardo AI", kategori: "tasarım", badge: "🎨 Görsel", desc: "Midjourney'e para vermeye son! Ücretsiz kredilerle yüksek kaliteli görseller çizdir.", link: "https://leonardo.ai", likes: 104 },
      { id: 2, ad: "Perplexity AI", kategori: "ogrenci", badge: "🎓 Araştırma", desc: "Tüm internetten araştırıp kaynaklarıyla birlikte direkt özetler.", link: "https://perplexity.ai", likes: 89 },
      { id: 3, ad: "Suno AI", kategori: "ses", badge: "🎵 Müzik", desc: "Sözleri yaz, senin için vokalli profesyonel stüdyo şarkısı üretsin.", link: "https://suno.com", likes: 142 },
      { id: 4, ad: "Gamma App", kategori: "ogrenci", badge: "📊 Sunum", desc: "Konuyu yaz, saniyeler içinde görsel tasarımıyla birlikte slayt hazırlasın.", link: "https://gamma.app", likes: 95 }
    ];

    let currentCategory = 'tümü';
    let favorites = JSON.parse(localStorage.getItem('treoxFavs')) || [];

    function renderTools(filterText = '') {
      const grid = document.getElementById('toolGrid');
      grid.innerHTML = ''; 

      tools.forEach(tool => {
        const matchesSearch = tool.ad.toLowerCase().includes(filterText) || tool.desc.toLowerCase().includes(filterText);
        const isFav = favorites.includes(tool.id);
        const matchesCategory = currentCategory === 'tümü' || (currentCategory === 'favoriler' && isFav) || tool.kategori === currentCategory;

        if (matchesSearch && matchesCategory) {
          const card = document.createElement('div');
          card.className = `card ${tool.kategori}`;
          card.innerHTML = `
            <span class="badge">${tool.badge}</span>
            <h3>${tool.ad}</h3>
            <p>${tool.desc}</p>
            
            <!-- GÖRSELDEKİ ALT MENÜ -->
            <div class="card-footer">
              <a href="${tool.link}" target="_blank" class="btn-link">Araca Git</a>
              <button class="action-btn" title="Beğen">🤍 ${tool.likes}</button>
              <button class="action-btn ${isFav ? 'starred' : ''}" onclick="toggleFav(${tool.id})" title="Kaydet">
                ${isFav ? '⭐' : '☆'}
              </button>
              <button class="action-btn" onclick="shareTool('${tool.ad}', '${tool.link}')" title="Paylaş">🔗</button>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    }

    function filterTools() { renderTools(document.getElementById('searchInput').value.toLowerCase()); }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      filterTools();
    }

    function toggleFav(id) {
      if (favorites.includes(id)) favorites = favorites.filter(favId => favId !== id);
      else favorites.push(id);
      localStorage.setItem('treoxFavs', JSON.stringify(favorites));
      filterTools();
    }

    function shareTool(ad, link) {
      if (navigator.share) {
        navigator.share({ title: ad, text: `Treox'ta bu ücretsiz yapay zeka aracını buldum: ${ad}`, url: link });
      } else {
        alert("Bağlantı kopyalandı: " + link);
      }
    }

    function randomTool() {
      const randomItem = tools[Math.floor(Math.random() * tools.length)];
      document.getElementById('searchInput').value = randomItem.ad;
      filterTools();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      document.getElementById('themeBtn').innerText = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
    }

    function toggleChat() {
      const chat = document.getElementById('chatWindow');
      chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
    }

    function botReply(type) {
      document.getElementById('quickReplies').style.display = 'none';
      let res = type === 'sunum' ? "Sunumlar için <b>Gamma App</b> efsanedir!" : type === 'foto' ? "Netleştirme için <b>Upscayl</b> kullanabilirsin." : "Şarkı için <b>Suno AI</b> tam sana göre.";
      document.getElementById('chatBody').innerHTML += `<div class="bot-msg" style="margin-top:10px;">${res}</div>`;
    }

    window.onload = () => renderTools();
  </script>
</body>
</html>
