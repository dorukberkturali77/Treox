<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treox - Yapay Zeka & Yazılım Araçları</title>
  
  <!-- Font & İkonlar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK (Uyumluluk Modu) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #f43f5e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      color: var(--primary);
    }

    .btn-add {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: var(--primary-hover);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 4rem 1rem 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    /* Arama ve Filtreler */
    .search-box {
      max-width: 500px;
      margin: 0 auto 2rem;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      padding-left: 2.8rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      outline: none;
      font-size: 1rem;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Grid Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* Kart Tasarımı */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .card-icon {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--primary);
    }

    .card-title h3 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .card-category {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .like-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .like-btn.liked {
      color: var(--accent);
      border-color: var(--accent);
    }

    .visit-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .visit-link:hover {
      text-decoration: underline;
    }

    /* Modal (Yeni Araç Ekleme Formu) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
    }

    .modal h2 {
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.6rem;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 1.5rem;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Üst Bar -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-cube"></i> Treox<span>.</span>
    </div>
    <button class="btn-add" onclick="openModal()"><i class="fa-solid fa-plus"></i> Araç Öner</button>
  </header>

  <!-- Ana Başlık & Arama -->
  <section class="hero">
    <h1>Yazılım & AI Dünyasını Keşfedin</h1>
    <p>En popüler yapay zeka araçlarını ve geliştirici yazılımlarını bir arada bulun.</p>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Araç adı veya açıklama ile ara..." oninput="filterTools()">
    </div>

    <!-- Kategoriler -->
    <div class="categories">
      <button class="cat-btn active" onclick="setCategory('hepsi', this)">Hepsi</button>
      <button class="cat-btn" onclick="setCategory('AI', this)">Yapay Zeka</button>
      <button class="cat-btn" onclick="setCategory('Kodlama', this)">Kodlama</button>
      <button class="cat-btn" onclick="setCategory('Tasarım', this)">Tasarım</button>
      <button class="cat-btn" onclick="setCategory('Üretkenlik', this)">Üretkenlik</button>
    </div>
  </section>

  <!-- Kartların Listelendiği Alan -->
  <main class="container">
    <div class="tools-grid" id="toolsGrid">
      <!-- Firebase'den gelen veriler buraya dinamik eklenecek -->
    </div>
  </main>

  <!-- Araç Ekleme Modalı -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>Yeni Araç Öner</h2>
      <form id="addToolForm" onsubmit="handleAddTool(event)">
        <div class="form-group">
          <label>Araç Adı</label>
          <input type="text" id="toolName" required placeholder="Örn: ChatGPT">
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="toolCategory">
            <option value="AI">Yapay Zeka</option>
            <option value="Kodlama">Kodlama</option>
            <option value="Tasarım">Tasarım</option>
            <option value="Üretkenlik">Üretkenlik</option>
          </select>
        </div>
        <div class="form-group">
          <label>Açıklama</label>
          <textarea id="toolDesc" rows="3" required placeholder="Araç ne işe yarar?"></textarea>
        </div>
        <div class="form-group">
          <label>Web Sitesi Linki (URL)</label>
          <input type="url" id="toolUrl" required placeholder="https://...">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">İptal</button>
          <button type="submit" class="btn-add">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript ve Firebase Mantığı -->
  <script>
    // 1. Firebase Yapılandırması (Sizin Proje Bilgileriniz)
    const firebaseConfig = {
      apiKey: "AIzaSyCZ9M6zKGNQMdHqSZpn85A4_h-CEbINByo",
      authDomain: "treox-9f404.firebaseapp.com",
      projectId: "treox-9f404",
      storageBucket: "treox-9f404.firebasestorage.app",
      messagingSenderId: "589494205116",
      appId: "1:589494205116:web:adba37b97d7841c84aeb9",
      measurementId: "G-B6Z6XS83BP"
    };

    // Firebase'i Başlat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Değişkenler
    let allTools = [];
    let currentCategory = 'hepsi';

    // 2. Sayfa Yüklendiğinde Verileri Firestore'dan Çek
    window.addEventListener('DOMContentLoaded', () => {
      listenToTools();
    });

    // Firestore'u Dinle (Gerçek Zamanlı Güncelleme)
    function listenToTools() {
      db.collection("tools").onSnapshot((snapshot) => {
        allTools = [];
        snapshot.forEach((doc) => {
          allTools.push({ id: doc.id, ...doc.data() });
        });

        // Veritabanı tamamen boşsa örnek birkaç veri yükleyelim
        if (allTools.length === 0) {
          seedInitialData();
        } else {
          renderTools();
        }
      });
    }

    // İlk kullanım için varsayılan araçlar
    async function seedInitialData() {
      const initialTools = [
        { name: "ChatGPT", category: "AI", desc: "Metin oluşturma, kod yazma ve soru cevaplama asistanı.", url: "https://chatgpt.com", likes: 12 },
        { name: "Cursor", category: "Kodlama", desc: "Yapay zeka destekli modern kod editörü.", url: "https://cursor.com", likes: 8 },
        { name: "Midjourney", category: "Tasarım", desc: "Komutlarla yüksek kaliteli görseller üreten AI.", url: "https://midjourney.com", likes: 15 }
      ];

      for (const tool of initialTools) {
        await db.collection("tools").add(tool);
      }
    }

    // 3. Ekran Kartlarını Çiz
    function renderTools() {
      const grid = document.getElementById('toolsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      grid.innerHTML = '';

      const filtered = allTools.filter(tool => {
        const matchesCategory = currentCategory === 'hepsi' || tool.category === currentCategory;
        const matchesSearch = tool.name.toLowerCase().includes(searchVal) || tool.desc.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Hiçbir araç bulunamadı.</p>`;
        return;
      }

      filtered.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
              <div class="card-title">
                <h3>${tool.name}</h3>
                <span class="card-category">${tool.category}</span>
              </div>
            </div>
            <p class="card-desc">${tool.desc}</p>
          </div>
          <div class="card-footer">
            <button class="like-btn" onclick="toggleLike('${tool.id}', ${tool.likes || 0})">
              <i class="fa-solid fa-heart"></i> <span>${tool.likes || 0}</span>
            </button>
            <a href="${tool.url}" target="_blank" class="visit-link">İncele <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 4. Beğeni Arttırma (Firestore Veritabanını Günceller)
    async function toggleLike(id, currentLikes) {
      const toolRef = db.collection("tools").doc(id);
      await toolRef.update({
        likes: currentLikes + 1
      });
    }

    // 5. Yeni Araç Ekleme
    async function handleAddTool(event) {
      event.preventDefault();

      const name = document.getElementById('toolName').value;
      const category = document.getElementById('toolCategory').value;
      const desc = document.getElementById('toolDesc').value;
      const url = document.getElementById('toolUrl').value;

      await db.collection("tools").add({
        name,
        category,
        desc,
        url,
        likes: 0
      });

      closeModal();
      document.getElementById('addToolForm').reset();
    }

    // Kategori & Filtre Mantığı
    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTools();
    }

    function filterTools() {
      renderTools();
    }

    // Modal Aç/Kapat
    function openModal() {
      document.getElementById('addModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('addModal').classList.remove('active');
    }
  </script>
</body>
</html>
